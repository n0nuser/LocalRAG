services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.12.6}
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  chromadb:
    image: chromadb/chroma:${CHROMA_IMAGE_TAG:-1.0.20}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/.chroma/index
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot init: pulls OLLAMA_EMBED_MODEL / OLLAMA_LLM_MODEL into the ollama
  # container via the existing `localrag setup` CLI command, then exits 0.
  # Runs from the same built image as localrag-api, so no separate script to
  # maintain. Exiting 0 is expected here — it's not meant to stay running.
  localrag-setup:
    build:
      context: .
      args:
        LOCALRAG_BUILD_SHA: ${LOCALRAG_BUILD_SHA:-unknown}
    image: localrag-api:local
    command: /app/.venv/bin/localrag setup
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    env_file:
      - path: .env
        required: false
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  localrag-api:
    build:
      context: .
      args:
        LOCALRAG_BUILD_SHA: ${LOCALRAG_BUILD_SHA:-unknown}
    image: localrag-api:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_PERSIST_PATH=/app/data/chroma
      - API_KEY=${API_KEY:?Set API_KEY in .env before starting Compose}
      - UV_CACHE_DIR=/tmp/uv-cache
    env_file:
      - path: .env
        required: false
    volumes:
      - localrag_data:/app/data
      - ./docs:/app/docs:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      ollama:
        condition: service_healthy
      localrag-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  localrag-mcp:
    build:
      context: .
      args:
        LOCALRAG_BUILD_SHA: ${LOCALRAG_BUILD_SHA:-unknown}
    image: localrag-api:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    command: ["/app/.venv/bin/uvicorn", "localrag.mcp.app:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_PERSIST_PATH=/app/data/chroma
      - API_KEY=${API_KEY:?Set API_KEY in .env before starting Compose}
      - UV_CACHE_DIR=/tmp/uv-cache
    env_file:
      - path: .env
        required: false
    volumes:
      - localrag_data:/app/data
      - ./docs:/app/docs:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      ollama:
        condition: service_healthy
      localrag-setup:
        condition: service_completed_successfully
    healthcheck:
      # FastMCP serves only the MCP endpoint - there is no /docs route. Probe /mcp
      # with a real JSON-RPC request; any HTTP response proves the app is serving.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen(u.Request('http://localhost:8002/mcp', data=b'{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/list\"}', headers={'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream'}))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      localrag-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  localrag_data:
  ollama_data:
  chroma_data:
  prometheus_data:
  grafana_data:
