apiVersion: apps/v1
kind: Deployment
metadata:
  name: localrag-api
  namespace: default
  labels:
    app: localrag-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localrag-api
  template:
    metadata:
      labels:
        app: localrag-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: localrag-api
          # CI publishes this release tag once; deployments must not use latest.
          image: ghcr.io/n0nuser/localrag-api:0.1.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: localrag-api-config
            - secretRef:
                name: localrag-api-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: localrag-data
        - name: tmp
          emptyDir: {}
