apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
# Constrained to one replica until Chroma and in-memory jobs are externalized.
metadata:
  name: localrag-api
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: localrag-api
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
