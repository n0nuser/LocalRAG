[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localrag"
version = "0.1.0"
description = "Offline-first RAG system. Your documents, your models, your machine."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Pablo Jesus Gonzalez Rubio", email = "gonzrubio.pablo@gmail.com" },
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "typer>=0.15",
    "chromadb>=1.0",
    "httpx>=0.28",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "python-docx>=1.1",
    "pydantic-settings>=2.8",
    "pyyaml>=6.0.3",
    "rich>=13",
    "charset-normalizer>=3.4",
    "sse-starlette>=2.2",
    "prometheus-client>=0.25.0",
    "structlog>=25.5.0",
    "openai>=2.33.0",
    "anthropic>=0.97.0",
    "ragas>=0.4.3",
    "langchain-community<0.4",  # ragas hard-imports langchain_community.chat_models.vertexai, dropped in 0.4
    "rank-bm25>=0.2.2",
    "python-multipart>=0.0.32",
    "tenacity>=9.1.4",
    "pybreaker>=1",
    "cachetools>=5",
    "pdf-inspector>=0.2.6",
    "firecrawl-anydoc==0.1.3",
    "fastmcp>=3.4,<4",
]

[project.scripts]
localrag = "localrag.cli.app:app"

[project.optional-dependencies]
rerank = ["sentence-transformers>=3"]
embedding = ["sentence-transformers>=3"]
tracking = ["mlflow>=3.1"]
observability = [
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
]
langfuse = ["langfuse>=3,<4"]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "respx",
    "pre-commit",
    "pytest-cov>=7.1.0",
    "bandit>=1.9.4",
    "mypy>=2.3.0",
]

# `localrag.cli` imports `evals` (benchmark, report, leaderboard commands), so the
# evaluation harness must ship in the wheel or the installed CLI fails at import.
[tool.hatch.build.targets.wheel]
packages = ["localrag", "evals"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "BLE001",
    "COM812",
    "ISC001",
    "D100",
    "D104",
    "D105",
    "D107",
    "D205",
    "D211",
    "D212",
    "ANN204",
    "ANN401",
    "S602",
    "ERA001",
    "PGH003",
    "PLR0913",
    "TRY400",
    "N803",
    "N815",
    "D101",
    "D102",
    "D103",
    "TC001",
    "TC002",
    "TC003",
    "S101",
    "B008",
    "FAST002",
    "FBT001",
    "INP001",
    "PERF401",
    "ARG002",
    "EM101",
    "PLR2004",
    "PLW0108",
    "S104",
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# The evaluation harness ships in the wheel, so it is linted like the rest of the
# package. These exemptions are inherent to what it is, not deferred cleanup:
# it is a report-printing CLI runner (T201) that talks to HTTP APIs with explicit
# per-call timeouts (ASYNC109) and defers optional-extra imports (PLC0415).
"evals/run_evals.py" = ["T201", "ASYNC109"]
"evals/concurrency.py" = ["ASYNC109"]
"evals/tracking.py" = ["PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires a running Docker stack",
]

[tool.coverage.run]
source = ["localrag"]
# Keep coverage focused on the application core.
# CLI modules are thin wrappers around services and are intentionally tested via
# service/API tests rather than by executing the CLI entrypoints themselves.
omit = [
    "localrag/cli/*",
    "localrag/cli/**",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]
fail_under = 80
